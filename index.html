<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>August 2026 Attendance Dashboard</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><header><div><h1>Attendance Dashboard</h1><p>August 2026 · Absent Management Report</p></div>
<select id="deptFilter"><option value="ALL">All Departments</option></select></header>
<main><section class="cards">
<div class="card"><span>Total Approved</span><strong id="approved">—</strong></div>
<div class="card"><span>Present Records</span><strong id="present">—</strong></div>
<div class="card"><span>Leave Records</span><strong id="leave">—</strong></div>
<div class="card"><span>Unauthorized Records</span><strong id="unauth">—</strong></div>
</section><section class="grid">
<div class="panel wide"><h2>Daily Attendance Trend</h2><canvas id="trend"></canvas></div>
<div class="panel"><h2>Department Summary</h2><canvas id="dept"></canvas></div>
<div class="panel wide"><h2>Department Details</h2><div class="tableWrap"><table id="detailTable">
<thead><tr><th>Department</th><th>Present</th><th>Leave</th><th>Unauthorized</th></tr></thead><tbody></tbody></table></div></div>
</section></main><script src="script.js"></script></body></html>
